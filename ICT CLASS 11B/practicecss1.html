<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Internal Css-->
     <style>
        p{
            color:blue;
            font-family: Arial, Helvetica, sans-serif;
            font-style: italic;
        }
        .third{
            color:yellow;
            font-family: "Lucida Console", "Courier New", monospace;
        }
        .fourth{
            color:green;
        }
     </style>
</head>
<body>
    <p style="color: red;font-family: 'Times New Roman', Times, serif;"> this is the first paragraph </p>
    <p> this is the second paragraph </p>
    <p class="third"> this is the third paragraph </p>
    <p class="fourth"> this is the fourth paragraph </p>
</body>
</html>
